<mat-toolbar class="admin-header-toolbar">
  <!-- Mobile menu button -->
  <button
    type="button"
    class="header-menu-btn lg:hidden p-2 rounded-lg text-text-tertiary hover:text-text-primary hover:bg-surface-hover transition-colors"
    (click)="onToggleSidebar()"
    aria-label="Abrir menu"
    matTooltip="Menu"
    matTooltipPosition="below"
  >
    <span class="text-xl font-bold">{{ mobileDrawerOpened ? "✕" : "☰" }}</span>
  </button>

  <!-- Desktop sidebar toggle -->
  <button
    type="button"
    class="header-menu-btn hidden lg:flex p-2 rounded-lg text-text-tertiary hover:text-text-primary hover:bg-surface-hover transition-colors"
    (click)="onToggleSidebar()"
    [attr.aria-label]="sidebarCollapsed ? 'Expandir menu' : 'Colapsar menu'"
    matTooltip="{{ sidebarCollapsed ? 'Expandir menu' : 'Colapsar menu' }}"
    matTooltipPosition="right"
  >
    <span class="text-xl font-bold">{{ sidebarCollapsed ? "▸" : "◂" }}</span>
  </button>

  <!-- Page title area (filled by PageHeader in content) -->
  <div class="header-title flex-1 min-w-0"></div>

  <!-- Notifications -->
  <div class="header-notifications relative">
    <button
      type="button"
      class="header-icon-btn p-2 rounded-lg text-text-tertiary hover:text-text-primary hover:bg-surface-hover transition-colors relative"
      [matMenuTriggerFor]="notificationsMenu"
      aria-label="Notificações"
      matTooltip="Notificações"
      matTooltipPosition="below"
    >
      <span class="text-xl font-bold">🔔</span>
      @if (notifications().length > 0) {
        <span
          class="notification-badge absolute -top-1 -right-1 w-5 h-5 rounded-full bg-state-danger text-state-on-danger text-xs font-medium flex items-center justify-center"
        >
          {{ notifications().length > 9 ? "9+" : notifications().length }}
        </span>
      }
    </button>

    <mat-menu
      #notificationsMenu="matMenu"
      class="notifications-menu"
      xPosition="before"
      yPosition="below"
    >
      <div
        class="notifications-header p-4 border-b border-border flex items-center justify-between"
      >
        <h3 class="text-sm font-semibold text-text-primary">Notificações</h3>
        @if (notifications().length > 0) {
          <button
            type="button"
            class="text-xs text-brand-primary hover:underline"
            (click)="clearAllNotifications()"
          >
            Limpar todas
          </button>
        }
      </div>

      <div class="notifications-list max-h-96 overflow-y-auto">
        @if (notifications().length === 0) {
          <div class="p-4 text-center text-text-tertiary text-sm">
            <span class="text-3xl mb-1 block">🔔</span>
            <p>Nenhuma notificação</p>
          </div>
        } @else {
          @for (notification of notifications(); track notification.id) {
            <button
              type="button"
              class="notification-item w-full p-4 hover:bg-surface-hover transition-colors text-left flex items-start gap-3"
              (click)="removeNotification(notification.id)"
            >
              <div
                class="notification-icon flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center"
                [class]="getNotificationIconClass(notification.type)"
              >
                <span class="text-sm">{{
                  getNotificationSymbol(notification.type)
                }}</span>
              </div>
              <div class="notification-content flex-1 min-w-0">
                <p
                  class="notification-title text-sm font-medium text-text-primary truncate"
                >
                  {{ notification.message }}
                </p>
                <p class="notification-time text-xs text-text-tertiary mt-1">
                  Agora mesmo
                </p>
              </div>
            </button>
          }
        }
      </div>
    </mat-menu>
  </div>

  <!-- User menu -->
  <div class="header-user-menu relative ml-2">
    <button
      type="button"
      class="header-user-btn flex items-center gap-2 p-1.5 rounded-lg hover:bg-surface-hover transition-colors"
      [matMenuTriggerFor]="userMenu"
      aria-label="Menu do usuário"
    >
      <div
        class="user-avatar w-8 h-8 rounded-full bg-brand-primary-subtle text-brand-primary-hover flex items-center justify-center text-sm font-medium"
      >
        {{ userInitials() }}
      </div>
      <span
        class="user-name hidden sm:block text-body font-medium text-text-secondary truncate max-w-[120px]"
      >
        {{ user()?.name || "Usuário" }}
      </span>
    </button>

    <mat-menu
      #userMenu="matMenu"
      class="user-menu"
      xPosition="before"
      yPosition="below"
    >
      <div class="user-menu-header p-3 border-b border-border">
        <div class="flex items-center gap-3">
          <div
            class="user-avatar w-10 h-10 rounded-full bg-brand-primary-subtle text-brand-primary-hover flex items-center justify-center text-base font-medium"
          >
            {{ userInitials() }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-text-primary truncate">
              {{ user()?.name || "Usuário" }}
            </p>
            <p class="text-xs text-text-tertiary truncate">
              {{ user()?.email }}
            </p>
          </div>
        </div>
        <p
          class="user-role mt-2 px-2 py-1 bg-brand-primary-subtle text-brand-primary-hover text-xs font-medium rounded-full inline-block"
        >
          {{ userRoleLabel() }}
        </p>
      </div>

      <mat-divider></mat-divider>

      <button
        type="button"
        mat-menu-item
        class="user-menu-item"
        routerLink="/settings"
        routerLinkActive
        (click)="userMenuOpen.set(false)"
      >
        <span class="text-sm mr-2">⚙</span>
        <span>Configurações</span>
      </button>

      <button
        type="button"
        mat-menu-item
        class="user-menu-item"
        routerLink="/profile"
        routerLinkActive
        (click)="userMenuOpen.set(false)"
      >
        <span class="text-sm mr-2">👤</span>
        <span>Meu perfil</span>
      </button>

      <mat-divider></mat-divider>

      <button
        type="button"
        mat-menu-item
        class="user-menu-item text-state-danger"
        (click)="onLogout()"
      >
        <span class="text-sm mr-2">⤴</span>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
