<div class="admin-layout min-h-screen bg-gray-50 flex">
  <!-- Mobile drawer backdrop -->
  @if (mobileDrawerOpened()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      (click)="closeMobileDrawer()"
      aria-hidden="true"></div>
  }

  <!-- Sidebar -->
  <aside
    class="admin-sidebar fixed lg:relative z-50 h-full lg:h-screen transition-all duration-300 ease-out"
    [class]="sidebarClasses()"
    [attr.aria-hidden]="mobileDrawerOpened() ? 'false' : 'true'"
    role="navigation"
    aria-label="Menu principal">
    
    <app-admin-sidebar
      [collapsed]="sidebarCollapsed()"
      [sections]="filteredNavSections()"
      [currentUrl]="currentUrl()"
      (navigate)="onSidebarNavigation($event)">
    </app-admin-sidebar>
  </aside>

  <!-- Main content area -->
  <div class="admin-main flex-1 flex flex-col min-w-0 lg:ml-0" [class.ml-64]="!sidebarCollapsed() && !mobileDrawerOpened()">
    <!-- Header -->
    <header class="admin-header sticky top-0 z-30">
      <app-admin-header
        [sidebarCollapsed]="sidebarCollapsed()"
        [mobileDrawerOpened]="mobileDrawerOpened()"
        (toggleSidebar)="toggleSidebar()"
        (logout)="logout()">
      </app-admin-header>
    </header>

    <!-- Main content -->
    <main class="admin-content flex-1" (click)="closeMobileDrawer()">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="admin-footer">
      <app-admin-footer></app-admin-footer>
    </footer>
  </div>
</div>
