@if (hasItems() || showHome) {
  <nav class="breadcrumb" aria-label="Navegação">
    <ol class="breadcrumb-list flex items-center gap-2 flex-wrap">
      @if (showHome) {
        <li class="breadcrumb-item">
          <a
            routerLink="/"
            class="breadcrumb-link flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 transition-colors"
          >
            <span class="hidden sm:inline">Início</span>
          </a>
        </li>
      }
      @for (item of items; track item.label; let i = $index; let last = $last) {
        <li class="breadcrumb-item flex items-center gap-2">
          @if (!last && item.url) {
            <a
              [routerLink]="item.url"
              class="breadcrumb-link flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 transition-colors"
            >
              @if (item.icon) {}
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <span
              class="breadcrumb-current flex items-center gap-1 text-sm text-gray-900 font-medium"
              aria-current="page"
            >
              @if (item.icon) {}
              <span>{{ item.label }}</span>
            </span>
          }
          @if (!last) {}
        </li>
      }
    </ol>
  </nav>
}
