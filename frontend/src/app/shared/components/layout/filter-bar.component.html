<section class="filter-bar" [class.collapsed]="!isExpanded()">
  <div class="filter-bar-content">
    <div
      class="filter-bar-main flex flex-col sm:flex-row sm:items-center gap-4"
    >
      @if (hasSearchContent()) {
        <div class="filter-search flex-1">
          <ng-container
            [ngTemplateOutlet]="searchContentTemplate"
          ></ng-container>
        </div>
      } @else {
        <div class="filter-search flex-1">
          <label for="filter-search" class="sr-only">{{
            searchPlaceholder
          }}</label>
          <div class="relative">
            <input
              id="filter-search"
              type="search"
              class="input w-full pr-4 py-2"
              [placeholder]="searchPlaceholder"
              [value]="searchValue"
              (input)="onSearchChange($any($event.target).value)"
              autocomplete="off"
            />
          </div>
        </div>
      }
      @if (showToggle && hasFilterContent()) {
        <button
          type="button"
          class="filter-toggle btn btn-secondary flex items-center gap-2 whitespace-nowrap"
          (click)="onToggle()"
          [attr.aria-expanded]="isExpanded()"
          aria-controls="filter-content"
        >
          <span class="hidden sm:inline">Filtros</span>
        </button>
      }
    </div>
    @if (hasFilterContent() && isExpanded()) {
      <div id="filter-content" class="filter-content mt-4 animate-slide-down">
        <div
          class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
        >
          <div class="filter-fields flex flex-col sm:flex-row gap-4 flex-1">
            <ng-container
              [ngTemplateOutlet]="filterContentTemplate"
            ></ng-container>
          </div>
          <div class="filter-actions flex items-center gap-2 w-full sm:w-auto">
            <button
              type="button"
              class="btn btn-outline btn-sm"
              (click)="onClearFilters()"
              [disabled]="!hasActiveFilters()"
            >
              Limpar
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</section>
