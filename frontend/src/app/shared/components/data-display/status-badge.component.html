<span
  class="status-badge inline-flex items-center font-medium"
  [class]="config().class + ' ' + sizeClasses()[size]"
  [attr.role]="clickable ? 'button' : null"
  [attr.tabindex]="clickable ? 0 : null"
  [attr.aria-label]="tooltip || effectiveLabel()"
  [attr.title]="tooltip || null"
>
  @if (showDot) {
    <span
      class="status-dot rounded-full flex-shrink-0"
      [class]="dotSizeClasses()[size]"
      [style.background-color]="config().dotColor"
    ></span>
  }
  @if (showIcon && config().icon) {}
  @if (effectiveLabel()) {
    <span class="status-label">{{ effectiveLabel() }}</span>
  }
</span>
