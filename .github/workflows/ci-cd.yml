name: CI/CD - Restaurante Cardápio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Job 1: Backend Tests with Testcontainers
  test-backend:
    name: Backend Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurante
          POSTGRES_USER: restaurante
          POSTGRES_PASSWORD: restaurante123
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready -U restaurante -d restaurante
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permissions for Maven
        run: chmod +x mvnw

      - name: Backend Tests with Testcontainers
        run: |
          cd backend
          ./mvnw test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  # Job 2: Frontend Tests with Jest
  test-frontend:
    name: Frontend Test (Jest + Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Jest tests
        run: cd frontend && npm test -- --watch=false --browsers=ChromeHeadless

      - name: Upload frontend test reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/junit

  # Job 3: Build Backend
  build-backend:
    name: Build Backend (Maven)
    needs: [test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permissions for Maven
        run: chmod +x mvnw

      - name: Build with Maven
        run: |
          cd backend
          ./mvnw clean package -DskipTests

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend/target/*.jar

  # Job 4: Build Frontend
  build-frontend:
    name: Build Frontend (Angular)
    needs: [test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Angular
        run: cd frontend && npm run build --configuration=production

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # Job 5: Docker Build and Push
  docker-build:
    name: Docker Build
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: arthurjava/menu-restaurante-backend:latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: arthurjava/menu-restaurante-frontend:latest

  # Job 6: Deploy Production
  deploy-production:
    name: Deploy Production
    needs: [docker-build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SERVER_PORT || 22 }}
          passphrase: ${{ secrets.PRODUCTION_SSH_KEY_PASSPHRASE }}
          files: |
            docker-compose.prod.yml
            nginx/nginx.conf

      - name: Run Docker Compose Production
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SERVER_PORT || 22 }}
          script: |
            cd restaurante
            docker-compose -f docker-compose.prod.yml up -d --build
            docker system prune -af