spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurante}
    username: ${DB_USER:restaurante}
    password: ${DB_PASSWORD:restaurante123}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 300000
      validation-timeout: 500000
      leak-detection-threshold: 600000
      connection-init-sql: "SET search_path TO public"
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-min-32-chars-long-enough}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: 604800000
  cors:
    allowed-origins: "http://localhost:4200"
  upload:
    dir: ./uploads
    url-prefix: /uploads